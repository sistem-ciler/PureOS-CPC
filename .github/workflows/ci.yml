name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pycryptodome flake8

      - name: Lint
        run: flake8 . --max-line-length=120 --ignore=E501
        continue-on-error: true

      - name: Import smoke test
        run: python -c "import RSAkeys; import pure_aes_cbc; print('imports OK')"
